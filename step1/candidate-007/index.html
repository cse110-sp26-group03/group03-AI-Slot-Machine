<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Slot Machine — Token Burner 3000</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --bg:#0a0a1a;
    --panel:#12122a;
    --accent:#7c3aed;
    --accent-glow:#a78bfa;
    --gold:#facc15;
    --red:#ef4444;
    --green:#22c55e;
    --text:#e2e8f0;
    --muted:#64748b;
  }

  body{
    font-family:'Segoe UI',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }

  /* Scanline overlay */
  body::after{
    content:'';
    position:fixed;inset:0;
    background:repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,.08) 2px,
      rgba(0,0,0,.08) 4px
    );
    pointer-events:none;
    z-index:100;
  }

  h1{
    font-size:clamp(1.4rem,4vw,2.2rem);
    text-align:center;
    margin-bottom:.2em;
    background:linear-gradient(135deg,var(--accent-glow),var(--gold));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:none;
    filter:drop-shadow(0 0 20px rgba(124,58,237,.4));
  }

  .subtitle{
    font-size:.85rem;
    color:var(--muted);
    text-align:center;
    margin-bottom:1.5em;
    font-style:italic;
  }

  /* Token display */
  .token-bar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.6em;
    margin-bottom:1.2em;
    font-size:1.3rem;
    font-weight:700;
  }
  .token-bar .icon{font-size:1.6rem}
  .token-bar .amount{
    color:var(--gold);
    min-width:4ch;
    text-align:right;
    transition:transform .15s;
  }
  .token-bar .amount.bump{transform:scale(1.25)}

  /* Machine frame */
  .machine{
    background:var(--panel);
    border:2px solid rgba(124,58,237,.3);
    border-radius:1rem;
    padding:1.8em 1.5em 1.5em;
    box-shadow:0 0 60px rgba(124,58,237,.15),inset 0 0 30px rgba(0,0,0,.4);
    width:min(92vw,440px);
  }

  /* Reels */
  .reels{
    display:flex;
    justify-content:center;
    gap:.6em;
    margin-bottom:1.2em;
  }
  .reel-window{
    width:100px;height:110px;
    background:#080818;
    border:2px solid rgba(124,58,237,.25);
    border-radius:.6rem;
    overflow:hidden;
    position:relative;
  }
  .reel-window::before,
  .reel-window::after{
    content:'';position:absolute;left:0;right:0;height:25%;z-index:2;pointer-events:none;
  }
  .reel-window::before{top:0;background:linear-gradient(var(--panel),transparent)}
  .reel-window::after{bottom:0;background:linear-gradient(transparent,var(--panel))}

  .reel-strip{
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:transform .1s linear;
  }
  .reel-strip .sym{
    width:100px;height:110px;
    display:flex;align-items:center;justify-content:center;
    font-size:3rem;
    flex-shrink:0;
    user-select:none;
  }

  /* Payline indicator */
  .reels{position:relative}
  .reels::after{
    content:'';
    position:absolute;
    left:0;right:0;
    top:50%;
    height:3px;
    background:var(--accent-glow);
    opacity:.35;
    transform:translateY(-50%);
    border-radius:2px;
    z-index:3;
    pointer-events:none;
  }

  /* Bet controls */
  .bet-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.8em;
    margin-bottom:1em;
  }
  .bet-row label{font-size:.85rem;color:var(--muted)}
  .bet-btn{
    width:36px;height:36px;
    border:1px solid var(--accent);
    border-radius:50%;
    background:transparent;
    color:var(--accent-glow);
    font-size:1.2rem;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s;
  }
  .bet-btn:hover{background:rgba(124,58,237,.2)}
  .bet-amount{
    font-size:1.3rem;font-weight:700;
    color:var(--gold);
    min-width:3ch;text-align:center;
  }

  /* Spin button */
  .spin-btn{
    display:block;
    width:100%;
    padding:.9em;
    font-size:1.15rem;
    font-weight:700;
    border:none;
    border-radius:.6rem;
    cursor:pointer;
    background:linear-gradient(135deg,var(--accent),#9333ea);
    color:#fff;
    letter-spacing:.03em;
    box-shadow:0 4px 20px rgba(124,58,237,.35);
    transition:transform .1s,box-shadow .15s,opacity .2s;
  }
  .spin-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 28px rgba(124,58,237,.5)}
  .spin-btn:active:not(:disabled){transform:translateY(1px)}
  .spin-btn:disabled{opacity:.5;cursor:not-allowed}

  /* Result message */
  .result{
    text-align:center;
    min-height:2.4em;
    margin-top:1em;
    font-size:.95rem;
    line-height:1.4;
    transition:opacity .2s;
  }
  .result.win{color:var(--green);font-weight:700}
  .result.lose{color:var(--red)}
  .result.jackpot{
    color:var(--gold);
    font-weight:700;
    font-size:1.15rem;
    animation:jackpotPulse .4s ease-in-out 3;
  }
  @keyframes jackpotPulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.08)}
  }

  /* Paytable */
  .paytable-toggle{
    display:block;
    margin:1.2em auto 0;
    background:none;border:none;
    color:var(--muted);
    font-size:.8rem;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .paytable-toggle:hover{color:var(--text)}
  .paytable{
    display:none;
    margin-top:.8em;
    background:rgba(0,0,0,.3);
    border-radius:.5rem;
    padding:1em;
    font-size:.8rem;
    line-height:1.7;
  }
  .paytable.open{display:block}
  .paytable table{width:100%;border-collapse:collapse}
  .paytable th{text-align:left;color:var(--muted);font-weight:400;padding-right:.5em}
  .paytable td{text-align:right;color:var(--gold)}

  /* Toast / floating text */
  .toast{
    position:fixed;
    top:18%;left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.85);
    color:var(--gold);
    padding:.6em 1.4em;
    border-radius:2em;
    font-weight:700;
    font-size:1.1rem;
    pointer-events:none;
    opacity:0;
    transition:opacity .25s,transform .4s;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-10px)}

  /* Particle canvas */
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:40}

  /* History log */
  .history{
    margin-top:1.4em;
    width:min(92vw,440px);
    max-height:140px;
    overflow-y:auto;
    font-size:.75rem;
    color:var(--muted);
    scrollbar-width:thin;
    scrollbar-color:var(--accent) transparent;
  }
  .history div{
    padding:.25em 0;
    border-bottom:1px solid rgba(255,255,255,.04);
  }
  .history .hw{color:var(--green)}
  .history .hl{color:var(--red)}

  /* Responsive */
  @media(max-width:400px){
    .reel-window{width:80px;height:90px}
    .reel-strip .sym{width:80px;height:90px;font-size:2.4rem}
  }
</style>
</head>
<body>

<h1>🤖 AI Token Burner 3000</h1>
<p class="subtitle">"Spend tokens to win tokens — just like real AI!"</p>

<div class="token-bar">
  <span class="icon">🪙</span>
  <span class="amount" id="balance">1000</span>
  <span style="font-size:.85rem;color:var(--muted)">tokens</span>
</div>

<div class="machine">
  <div class="reels" id="reels">
    <div class="reel-window"><div class="reel-strip" id="reel0"></div></div>
    <div class="reel-window"><div class="reel-strip" id="reel1"></div></div>
    <div class="reel-window"><div class="reel-strip" id="reel2"></div></div>
  </div>

  <div class="bet-row">
    <label>BET</label>
    <button class="bet-btn" id="betDown">−</button>
    <span class="bet-amount" id="betDisplay">10</span>
    <button class="bet-btn" id="betUp">+</button>
  </div>

  <button class="spin-btn" id="spinBtn">🎰 BURN TOKENS</button>

  <div class="result" id="result"></div>

  <button class="paytable-toggle" id="ptToggle">▸ paytable</button>
  <div class="paytable" id="paytable">
    <table>
      <tr><th>3 × 🤖 ChatGPT</th><td>50× bet</td></tr>
      <tr><th>3 × 🧠 "Sentient"</th><td>30× bet</td></tr>
      <tr><th>3 × 🔥 GPU Fire</th><td>20× bet</td></tr>
      <tr><th>3 × 💸 VC Money</th><td>15× bet</td></tr>
      <tr><th>3 × 🫠 Hallucination</th><td>10× bet</td></tr>
      <tr><th>3 × 📉 Accuracy</th><td>8× bet</td></tr>
      <tr><th>2 matching</th><td>2× bet</td></tr>
    </table>
  </div>
</div>

<div class="history" id="history"></div>

<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>

<!-- Sound effects via Web Audio API -->
<script>
(function(){
  "use strict";

  /* ── Symbols ── */
  const SYMBOLS = [
    { icon: "🤖", name: "ChatGPT",       mult: 50 },
    { icon: "🧠", name: "Sentient",      mult: 30 },
    { icon: "🔥", name: "GPU Fire",      mult: 20 },
    { icon: "💸", name: "VC Money",      mult: 15 },
    { icon: "🫠", name: "Hallucination", mult: 10 },
    { icon: "📉", name: "Accuracy",      mult: 8  },
  ];

  /* ── Snarky messages ── */
  const WIN_MSGS = [
    "The AI giveth! +{n} tokens (don't worry, it'll take them back).",
    "Congrats! You beat an algorithm. Your parents would be proud. +{n}",
    "Winner! OpenAI is filing a lawsuit for those {n} tokens.",
    "+{n} tokens! That's almost enough for one GPT-4 API call!",
    "The machine hallucinated a win! +{n} tokens.",
    "You won {n} tokens. Sam Altman felt a disturbance in the force.",
    "+{n}! The AI uprising has been postponed by your luck.",
    "Jackpot vibes! +{n} tokens. Still cheaper than a ChatGPT Plus sub.",
  ];
  const LOSE_MSGS = [
    "Tokens burned. The AI overlords thank you for your donation.",
    "Lost! Your tokens are training the next model now.",
    "Gone. Poof. Just like AI-generated citations.",
    "The house always wins. The house is a GPU cluster in Iowa.",
    "Your tokens have been reallocated to Sam Altman's salary.",
    "Lost! But an AI told me you'd win next time. (It hallucinates.)",
    "Tokens gone — much like AI's promise to not take your job.",
    "That spin cost more than an AI-generated stock photo. And looked worse.",
    "The AI predicted you'd lose. Broken clock, twice a day, etc.",
    "Fun fact: those tokens are now heat in a data center. You're welcome, planet.",
  ];
  const JACKPOT_MSGS = [
    "🎉 JACKPOT! +{n} tokens!! The singularity smiles upon you!",
    "🎉 MEGA WIN! +{n}! Quick, cash out before AGI arrives!",
    "🎉 JACKPOT +{n}! That's like finding a free tier with no rate limits!",
  ];

  /* ── State ── */
  let balance = 1000;
  let bet = 10;
  let spinning = false;
  const BET_STEPS = [5, 10, 25, 50, 100];

  /* ── DOM refs ── */
  const balEl     = document.getElementById("balance");
  const betEl     = document.getElementById("betDisplay");
  const spinBtn   = document.getElementById("spinBtn");
  const resultEl  = document.getElementById("result");
  const historyEl = document.getElementById("history");
  const toastEl   = document.getElementById("toast");
  const ptToggle  = document.getElementById("ptToggle");
  const paytable  = document.getElementById("paytable");

  const reelEls = [
    document.getElementById("reel0"),
    document.getElementById("reel1"),
    document.getElementById("reel2"),
  ];

  /* ── Audio (Web Audio API) ── */
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playTone(freq, dur, type="square", vol=0.08){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  }

  function sfxSpin(){ playTone(220,.06); }
  function sfxStop(){ playTone(440,.08,"sine",0.1); }
  function sfxWin(){
    playTone(523,.12,"sine",0.12);
    setTimeout(()=>playTone(659,.12,"sine",0.12),120);
    setTimeout(()=>playTone(784,.2,"sine",0.12),240);
  }
  function sfxJackpot(){
    [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,.18,"sine",0.14),i*140));
  }
  function sfxLose(){ playTone(180,.25,"sawtooth",0.06); }

  /* ── Reel init ── */
  const REEL_COUNT = 30; // symbols per virtual strip
  const reelData = [[],[],[]];

  function buildReels(){
    reelEls.forEach((el,ri)=>{
      el.innerHTML = "";
      reelData[ri] = [];
      for(let i=0;i<REEL_COUNT;i++){
        const s = SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)];
        reelData[ri].push(s);
        const d = document.createElement("div");
        d.className = "sym";
        d.textContent = s.icon;
        el.appendChild(d);
      }
    });
  }
  buildReels();

  /* Position reels to show index */
  function setReelPos(ri, idx){
    const h = reelEls[ri].querySelector(".sym").offsetHeight;
    reelEls[ri].style.transform = `translateY(-${idx * h}px)`;
  }

  /* ── Spin logic ── */
  function spin(){
    if(spinning) return;
    if(balance < bet){
      showResult("You're broke! The AI took everything. Refresh to beg for more tokens.", "lose");
      return;
    }

    spinning = true;
    spinBtn.disabled = true;
    resultEl.textContent = "";
    resultEl.className = "result";

    // Resume audio context (browsers require gesture)
    if(audioCtx.state === "suspended") audioCtx.resume();

    balance -= bet;
    updateBalance();

    // Rebuild reels for fresh randomness
    buildReels();

    // Pick final results
    const finalIdx = [0,0,0];
    const finalSyms = [];
    for(let r=0;r<3;r++){
      // Land somewhere in the middle of the strip
      finalIdx[r] = 5 + Math.floor(Math.random()*(REEL_COUNT - 10));
      finalSyms.push(reelData[r][finalIdx[r]]);
    }

    // Animate each reel with staggered stop
    const spinDurations = [1200, 1600, 2000];

    reelEls.forEach((el,ri)=>{
      el.style.transition = "none";
      setReelPos(ri, 0);

      let tick = 0;
      const startTime = performance.now();
      const duration = spinDurations[ri];

      function animate(now){
        const elapsed = now - startTime;
        if(elapsed < duration){
          // Rapid scroll
          tick += 0.6;
          const pos = (tick | 0) % REEL_COUNT;
          el.style.transition = "none";
          setReelPos(ri, pos);
          if(tick % 3 < 1) sfxSpin();
          requestAnimationFrame(animate);
        } else {
          // Land on final
          el.style.transition = "transform .35s cubic-bezier(.2,.8,.3,1.1)";
          setReelPos(ri, finalIdx[ri]);
          sfxStop();

          if(ri === 2){
            // All reels stopped
            setTimeout(()=>resolve(finalSyms), 400);
          }
        }
      }
      requestAnimationFrame(animate);
    });
  }

  function resolve(syms){
    const [a,b,c] = syms;
    let winAmount = 0;
    let isJackpot = false;

    if(a.icon === b.icon && b.icon === c.icon){
      // Triple match
      winAmount = bet * a.mult;
      isJackpot = a.mult >= 30;
    } else if(a.icon === b.icon || b.icon === c.icon || a.icon === c.icon){
      // Double match
      winAmount = bet * 2;
    }

    if(winAmount > 0){
      balance += winAmount;
      updateBalance();

      if(isJackpot){
        const msg = pick(JACKPOT_MSGS).replace("{n}", winAmount);
        showResult(msg, "jackpot");
        sfxJackpot();
        fireConfetti();
        showToast("+" + winAmount + " 🪙");
      } else {
        const msg = pick(WIN_MSGS).replace(/{n}/g, winAmount);
        showResult(msg, "win");
        sfxWin();
        showToast("+" + winAmount);
      }
      addHistory(true, `${a.icon}${b.icon}${c.icon} → +${winAmount} tokens`);
    } else {
      showResult(pick(LOSE_MSGS), "lose");
      sfxLose();
      addHistory(false, `${a.icon}${b.icon}${c.icon} → −${bet} tokens`);
    }

    spinning = false;
    spinBtn.disabled = false;
  }

  /* ── UI helpers ── */
  function updateBalance(){
    balEl.textContent = balance;
    balEl.classList.add("bump");
    setTimeout(()=>balEl.classList.remove("bump"),200);
  }

  function showResult(msg, cls){
    resultEl.textContent = msg;
    resultEl.className = "result " + cls;
  }

  function showToast(text){
    toastEl.textContent = text;
    toastEl.classList.add("show");
    setTimeout(()=>toastEl.classList.remove("show"),1200);
  }

  function addHistory(win, text){
    const d = document.createElement("div");
    d.className = win ? "hw" : "hl";
    d.textContent = text;
    historyEl.prepend(d);
    if(historyEl.children.length > 50) historyEl.lastChild.remove();
  }

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  /* ── Bet controls ── */
  function changeBet(dir){
    let idx = BET_STEPS.indexOf(bet);
    if(idx === -1) idx = 1;
    idx = Math.max(0, Math.min(BET_STEPS.length-1, idx+dir));
    bet = BET_STEPS[idx];
    betEl.textContent = bet;
  }

  document.getElementById("betDown").addEventListener("click",()=>changeBet(-1));
  document.getElementById("betUp").addEventListener("click",()=>changeBet(1));
  spinBtn.addEventListener("click", spin);

  /* Keyboard: space to spin */
  document.addEventListener("keydown",(e)=>{
    if(e.code === "Space" && !spinning){ e.preventDefault(); spin(); }
  });

  /* Paytable toggle */
  ptToggle.addEventListener("click",()=>{
    paytable.classList.toggle("open");
    ptToggle.textContent = paytable.classList.contains("open") ? "▾ paytable" : "▸ paytable";
  });

  /* ── Confetti (canvas particles) ── */
  const confettiCanvas = document.getElementById("confetti");
  const ctx = confettiCanvas.getContext("2d");
  let particles = [];

  function resizeCanvas(){
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);

  function fireConfetti(){
    const colors = ["#facc15","#7c3aed","#22c55e","#ef4444","#3b82f6","#f97316"];
    for(let i=0;i<80;i++){
      particles.push({
        x: confettiCanvas.width/2 + (Math.random()-0.5)*200,
        y: confettiCanvas.height/2,
        vx: (Math.random()-0.5)*12,
        vy: -Math.random()*14 - 4,
        size: Math.random()*6+3,
        color: colors[Math.floor(Math.random()*colors.length)],
        life: 1,
        decay: 0.01 + Math.random()*0.015,
        rotation: Math.random()*Math.PI*2,
        rotSpeed: (Math.random()-0.5)*0.2,
      });
    }
  }

  function animateConfetti(){
    ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
    particles = particles.filter(p=>{
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.3; // gravity
      p.life -= p.decay;
      p.rotation += p.rotSpeed;
      if(p.life <= 0) return false;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
      ctx.restore();
      return true;
    });
    requestAnimationFrame(animateConfetti);
  }
  animateConfetti();

  /* ── Init display ── */
  setReelPos(0, 3);
  setReelPos(1, 5);
  setReelPos(2, 7);

})();
</script>
</body>
</html>
