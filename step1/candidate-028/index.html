<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Token Slot Machine</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #e0e0e0;
    overflow: hidden;
  }

  h1 {
    font-size: 2.4rem;
    margin-bottom: 0.2rem;
    background: linear-gradient(90deg, #00f0ff, #ff6ec7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
  }

  .subtitle {
    font-size: 0.95rem;
    color: #9a8fc2;
    margin-bottom: 1.5rem;
    font-style: italic;
  }

  /* Token balance */
  .balance-bar {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 1.3rem;
    margin-bottom: 1.2rem;
    background: rgba(255,255,255,0.06);
    padding: 0.5rem 1.4rem;
    border-radius: 2rem;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .balance-bar .icon { font-size: 1.5rem; }
  .balance-bar #balance { font-weight: 700; color: #00f0ff; }

  /* Machine frame */
  .machine {
    background: linear-gradient(180deg, #1a1640, #12102e);
    border: 3px solid #6c3ec7;
    border-radius: 1.2rem;
    padding: 2rem 2.5rem 1.8rem;
    box-shadow: 0 0 40px rgba(108,62,199,0.35), inset 0 0 30px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  /* Reels */
  .reels {
    display: flex;
    gap: 0.8rem;
    margin-bottom: 1.4rem;
  }

  .reel-window {
    width: 100px;
    height: 120px;
    overflow: hidden;
    border-radius: 0.6rem;
    background: #0d0b1a;
    border: 2px solid #4a3a80;
    position: relative;
  }

  .reel-strip {
    display: flex;
    flex-direction: column;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    transition: top 0.1s linear;
  }

  .reel-cell {
    width: 100px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.2rem;
    flex-shrink: 0;
    user-select: none;
  }

  /* Glow line across middle */
  .reels::after {
    content: '';
    position: absolute;
    left: 1.5rem;
    right: 1.5rem;
    top: 50%;
    height: 2px;
    background: rgba(0,240,255,0.3);
    pointer-events: none;
    transform: translateY(8px);
  }

  /* Bet controls */
  .bet-row {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-bottom: 1rem;
    font-size: 1rem;
  }
  .bet-row button {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid #6c3ec7;
    background: rgba(108,62,199,0.2);
    color: #ccc;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bet-row button:hover { background: rgba(108,62,199,0.45); }
  #bet-display {
    min-width: 60px;
    text-align: center;
    font-weight: 700;
    color: #ff6ec7;
    font-size: 1.15rem;
  }

  /* Spin button */
  #spin-btn {
    padding: 0.85rem 3rem;
    font-size: 1.3rem;
    font-weight: 700;
    border: none;
    border-radius: 3rem;
    background: linear-gradient(135deg, #6c3ec7, #ff6ec7);
    color: #fff;
    cursor: pointer;
    letter-spacing: 0.05em;
    box-shadow: 0 4px 20px rgba(108,62,199,0.5);
    transition: transform 0.1s, box-shadow 0.15s;
  }
  #spin-btn:hover:not(:disabled) {
    transform: scale(1.05);
    box-shadow: 0 6px 28px rgba(108,62,199,0.7);
  }
  #spin-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Message banner */
  .message {
    margin-top: 1rem;
    min-height: 2.4rem;
    font-size: 1.05rem;
    text-align: center;
    max-width: 340px;
    line-height: 1.35;
  }
  .message.win { color: #00f0ff; font-weight: 700; }
  .message.lose { color: #9a8fc2; }
  .message.jackpot { color: #ffe14d; font-weight: 700; font-size: 1.25rem; }
  .message.broke { color: #ff4d6a; font-weight: 700; }

  /* Paytable */
  .paytable {
    margin-top: 1.6rem;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 0.8rem;
    padding: 1rem 1.4rem;
    font-size: 0.85rem;
    color: #9a8fc2;
    max-width: 380px;
    width: 100%;
  }
  .paytable h3 {
    text-align: center;
    margin-bottom: 0.5rem;
    color: #ccc;
    font-size: 0.95rem;
  }
  .paytable-row {
    display: flex;
    justify-content: space-between;
    padding: 0.25rem 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .paytable-row:last-child { border-bottom: none; }
  .paytable-row .payout { color: #00f0ff; font-weight: 600; }

  /* Confetti canvas */
  #confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>

<h1>AI Token Slots</h1>
<p class="subtitle">"Your tokens are my tokens." &mdash; Every LLM ever</p>

<div class="balance-bar">
  <span class="icon">🪙</span>
  <span>Tokens:</span>
  <span id="balance">1000</span>
</div>

<div class="machine">
  <div class="reels" id="reels"></div>

  <div class="bet-row">
    <span>Bet:</span>
    <button id="bet-down" aria-label="Decrease bet">-</button>
    <span id="bet-display">50</span>
    <button id="bet-up" aria-label="Increase bet">+</button>
  </div>

  <button id="spin-btn">SPEND TOKENS</button>

  <div class="message" id="message"></div>
</div>

<div class="paytable" id="paytable"></div>

<canvas id="confetti"></canvas>

<script>
// ── Symbols & payouts ──
const SYMBOLS = [
  { emoji: '🤖', name: 'Robot',          multiplier: 10 },
  { emoji: '🧠', name: 'Brain',          multiplier: 7  },
  { emoji: '💬', name: 'Chat Bubble',    multiplier: 5  },
  { emoji: '🔥', name: 'GPU on Fire',    multiplier: 4  },
  { emoji: '👁️', name: 'All-Seeing AI',  multiplier: 3  },
  { emoji: '📊', name: 'Benchmark',      multiplier: 2  },
  { emoji: '💀', name: 'Dead Startup',   multiplier: 1  },
  { emoji: '🎰', name: 'Slot Machine',   multiplier: 15 },
];

const QUIPS_WIN = [
  "Nice! The AI overlords approve.",
  "Tokens acquired. Your context window grows.",
  "You beat the transformer. For now.",
  "The attention mechanism focused on YOU.",
  "Prompt engineering pays off!",
  "Your gradient just descended into profit!",
  "Inference complete: you're a winner.",
  "The loss function is crying.",
];

const QUIPS_LOSE = [
  "Tokens hallucinated away...",
  "The model confidently lost your money.",
  "Training data suggests: you lose.",
  "That's what we call overfitting to hope.",
  "Your tokens were used for fine-tuning.",
  "The AI thanks you for the donation.",
  "Error 402: insufficient luck.",
  "Token limit exceeded. Wallet empty.",
  "Catastrophic forgetting... of your balance.",
  "The AI ate your tokens. No refunds.",
];

const QUIPS_JACKPOT = [
  "JACKPOT! AGI achieved (in your wallet)!",
  "You broke the alignment! Tokens everywhere!",
  "The singularity is HERE and it's PAYING OUT!",
  "Sam Altman wants to know your location.",
];

const QUIPS_BROKE = [
  "All tokens spent. The AI wins again.",
  "Context window: empty. Just like your balance.",
  "You've been fully deprecated.",
  "Game over. Please insert more venture capital.",
];

// ── State ──
let balance = 1000;
let bet = 50;
const BET_STEP = 25;
const BET_MIN = 25;
let spinning = false;

// ── DOM refs ──
const balanceEl  = document.getElementById('balance');
const betDisplay = document.getElementById('bet-display');
const spinBtn    = document.getElementById('spin-btn');
const messageEl  = document.getElementById('message');
const reelsEl    = document.getElementById('reels');

// ── Build reels ──
const NUM_REELS = 3;
const VISIBLE = 1;           // cells visible per reel
const STRIP_LEN = 30;        // symbols per strip
const reelData = [];          // { strip: [], el: stripEl }

function buildReels() {
  reelsEl.innerHTML = '';
  reelData.length = 0;

  for (let r = 0; r < NUM_REELS; r++) {
    const win = document.createElement('div');
    win.className = 'reel-window';
    const strip = document.createElement('div');
    strip.className = 'reel-strip';

    const symbols = [];
    for (let i = 0; i < STRIP_LEN; i++) {
      const sym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
      symbols.push(sym);
      const cell = document.createElement('div');
      cell.className = 'reel-cell';
      cell.textContent = sym.emoji;
      strip.appendChild(cell);
    }

    win.appendChild(strip);
    reelsEl.appendChild(win);
    reelData.push({ strip: symbols, el: strip, pos: 0 });
  }
}
buildReels();

// ── Paytable ──
function renderPaytable() {
  const pt = document.getElementById('paytable');
  let html = '<h3>Paytable (3 matching)</h3>';
  const sorted = [...SYMBOLS].sort((a, b) => b.multiplier - a.multiplier);
  for (const s of sorted) {
    html += `<div class="paytable-row">
      <span>${s.emoji} ${s.emoji} ${s.emoji} ${s.name}</span>
      <span class="payout">${s.multiplier}x bet</span>
    </div>`;
  }
  html += `<div class="paytable-row"><span>2 matching</span><span class="payout">1x bet (push)</span></div>`;
  pt.innerHTML = html;
}
renderPaytable();

// ── Bet controls ──
document.getElementById('bet-down').addEventListener('click', () => {
  if (spinning) return;
  bet = Math.max(BET_MIN, bet - BET_STEP);
  betDisplay.textContent = bet;
});
document.getElementById('bet-up').addEventListener('click', () => {
  if (spinning) return;
  bet = Math.min(balance, bet + BET_STEP);
  betDisplay.textContent = bet;
});

// ── Spin logic ──
spinBtn.addEventListener('click', spin);
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !spinning) { e.preventDefault(); spin(); }
});

function spin() {
  if (spinning || balance <= 0) return;
  if (bet > balance) bet = balance;
  betDisplay.textContent = bet;
  spinning = true;
  spinBtn.disabled = true;
  messageEl.textContent = '';
  messageEl.className = 'message';

  balance -= bet;
  balanceEl.textContent = balance;

  // Pick results
  const results = [];
  for (let r = 0; r < NUM_REELS; r++) {
    results.push(SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
  }

  // Animate each reel
  const durations = [1200, 1600, 2100]; // staggered stops
  const promises = reelData.map((reel, i) => animateReel(reel, results[i], durations[i]));

  Promise.all(promises).then(() => {
    evaluate(results);
    spinning = false;
    spinBtn.disabled = balance <= 0;
    if (balance <= 0) {
      messageEl.textContent = pick(QUIPS_BROKE);
      messageEl.className = 'message broke';
      // Auto-reset after a moment
      setTimeout(() => {
        balance = 1000;
        balanceEl.textContent = balance;
        bet = 50;
        betDisplay.textContent = bet;
        spinBtn.disabled = false;
        messageEl.textContent = 'Free refill! VCs just raised another round.';
        messageEl.className = 'message win';
      }, 2500);
    }
  });

  // Sound effect via Web Audio API
  playSpinSound();
}

function animateReel(reel, targetSym, duration) {
  return new Promise(resolve => {
    const cellH = 120;
    const strip = reel.el;

    // Rebuild strip with lots of random symbols, ending on target
    strip.innerHTML = '';
    const totalCells = 20 + Math.floor(Math.random() * 10);
    for (let i = 0; i < totalCells - 1; i++) {
      const s = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
      const cell = document.createElement('div');
      cell.className = 'reel-cell';
      cell.textContent = s.emoji;
      strip.appendChild(cell);
    }
    // Last cell is the target
    const finalCell = document.createElement('div');
    finalCell.className = 'reel-cell';
    finalCell.textContent = targetSym.emoji;
    strip.appendChild(finalCell);

    const targetTop = -((totalCells - 1) * cellH);
    strip.style.transition = 'none';
    strip.style.top = '0px';

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        strip.style.transition = `top ${duration}ms cubic-bezier(0.15, 0.8, 0.3, 1)`;
        strip.style.top = targetTop + 'px';
      });
    });

    setTimeout(() => {
      playStopSound();
      resolve();
    }, duration);
  });
}

function evaluate(results) {
  const emojis = results.map(r => r.emoji);

  // Three of a kind
  if (emojis[0] === emojis[1] && emojis[1] === emojis[2]) {
    const mult = results[0].multiplier;
    const winnings = bet * mult;
    balance += winnings;
    balanceEl.textContent = balance;

    if (mult >= 10) {
      messageEl.textContent = pick(QUIPS_JACKPOT) + ` (+${winnings} tokens!)`;
      messageEl.className = 'message jackpot';
      launchConfetti();
    } else {
      messageEl.textContent = pick(QUIPS_WIN) + ` (+${winnings} tokens)`;
      messageEl.className = 'message win';
      if (mult >= 5) launchConfetti();
    }
    playWinSound();
    return;
  }

  // Two of a kind — push (return bet)
  if (emojis[0] === emojis[1] || emojis[1] === emojis[2] || emojis[0] === emojis[2]) {
    balance += bet;
    balanceEl.textContent = balance;
    messageEl.textContent = "Two matching — push. Tokens returned.";
    messageEl.className = 'message win';
    return;
  }

  // Loss
  messageEl.textContent = pick(QUIPS_LOSE);
  messageEl.className = 'message lose';
}

// ── Helpers ──
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// ── Web Audio Sounds ──
let audioCtx;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playSpinSound() {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.connect(gain).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.3);
  } catch(e) {}
}

function playStopSound() {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, ctx.currentTime);
    gain.gain.setValueAtTime(0.06, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    osc.connect(gain).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.1);
  } catch(e) {}
}

function playWinSound() {
  try {
    const ctx = getAudioCtx();
    [523, 659, 784, 1047].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, ctx.currentTime + i * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.3);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.12);
      osc.stop(ctx.currentTime + i * 0.12 + 0.3);
    });
  } catch(e) {}
}

// ── Confetti ──
const confettiCanvas = document.getElementById('confetti');
const confettiCtx = confettiCanvas.getContext('2d');
let confettiPieces = [];
let confettiAnim = null;

function resizeConfetti() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeConfetti);
resizeConfetti();

function launchConfetti() {
  confettiPieces = [];
  const emojis = ['🪙', '🤖', '✨', '🧠', '💰', '🎰'];
  for (let i = 0; i < 60; i++) {
    confettiPieces.push({
      x: Math.random() * confettiCanvas.width,
      y: -20 - Math.random() * 200,
      vx: (Math.random() - 0.5) * 4,
      vy: 2 + Math.random() * 4,
      rot: Math.random() * 360,
      vr: (Math.random() - 0.5) * 10,
      emoji: emojis[Math.floor(Math.random() * emojis.length)],
      size: 18 + Math.random() * 14,
    });
  }
  if (!confettiAnim) animateConfetti();
}

function animateConfetti() {
  confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  let alive = false;
  for (const p of confettiPieces) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.08;
    p.rot += p.vr;
    if (p.y < confettiCanvas.height + 40) {
      alive = true;
      confettiCtx.save();
      confettiCtx.translate(p.x, p.y);
      confettiCtx.rotate(p.rot * Math.PI / 180);
      confettiCtx.font = `${p.size}px serif`;
      confettiCtx.textAlign = 'center';
      confettiCtx.textBaseline = 'middle';
      confettiCtx.fillText(p.emoji, 0, 0);
      confettiCtx.restore();
    }
  }
  if (alive) {
    confettiAnim = requestAnimationFrame(animateConfetti);
  } else {
    confettiAnim = null;
    confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  }
}
</script>
</body>
</html>
