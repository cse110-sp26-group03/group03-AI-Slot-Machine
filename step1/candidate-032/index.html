<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Slot Machine — Token Burner 3000</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0d0d1a;
    --panel: #1a1a2e;
    --accent: #00e5ff;
    --gold: #ffd700;
    --danger: #ff4060;
    --text: #e0e0e0;
    --reel-bg: #111122;
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }

  /* Scanline overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,.06) 0px,
      rgba(0,0,0,.06) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 100;
  }

  h1 {
    font-size: 2rem;
    text-transform: uppercase;
    letter-spacing: .15em;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(0,229,255,.4);
    margin-bottom: .25rem;
  }

  .subtitle {
    font-size: .85rem;
    color: #888;
    margin-bottom: 1.5rem;
    font-style: italic;
  }

  /* Token display */
  .token-bar {
    display: flex;
    align-items: center;
    gap: .6rem;
    background: var(--panel);
    padding: .5rem 1.4rem;
    border-radius: 2rem;
    margin-bottom: 1.2rem;
    border: 1px solid rgba(255,215,0,.25);
  }

  .token-bar .icon { font-size: 1.4rem; }

  .token-bar .amount {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--gold);
    min-width: 3ch;
    text-align: right;
    transition: transform .15s;
  }

  .token-bar .amount.pop {
    transform: scale(1.3);
  }

  .token-bar .label {
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: #999;
  }

  /* Machine frame */
  .machine {
    background: var(--panel);
    border: 2px solid rgba(0,229,255,.15);
    border-radius: 1rem;
    padding: 1.5rem 2rem 1.2rem;
    box-shadow: 0 0 40px rgba(0,229,255,.08), inset 0 0 60px rgba(0,0,0,.4);
    position: relative;
  }

  /* Reels */
  .reels {
    display: flex;
    gap: .6rem;
    margin-bottom: 1rem;
  }

  .reel-window {
    width: 100px;
    height: 120px;
    background: var(--reel-bg);
    border-radius: .5rem;
    overflow: hidden;
    border: 2px solid rgba(0,229,255,.12);
    position: relative;
  }

  /* Highlight bar across center */
  .reels::after {
    content: '';
    position: absolute;
    left: 1.4rem;
    right: 1.4rem;
    top: 50%;
    height: 46px;
    transform: translateY(-70%);
    border-top: 2px solid var(--accent);
    border-bottom: 2px solid var(--accent);
    pointer-events: none;
    opacity: .35;
    border-radius: 2px;
  }

  .reel-strip {
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform .1s linear;
  }

  .reel-cell {
    width: 100px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    flex-shrink: 0;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: .8rem;
    align-items: center;
    justify-content: center;
  }

  .bet-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .25rem;
  }

  .bet-group .label {
    font-size: .65rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: #777;
  }

  .bet-controls {
    display: flex;
    gap: .3rem;
    align-items: center;
  }

  .bet-controls .bet-val {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--gold);
    min-width: 2.5ch;
    text-align: center;
  }

  button {
    cursor: pointer;
    border: none;
    border-radius: .5rem;
    font-family: inherit;
    font-weight: 600;
    transition: transform .1s, box-shadow .15s;
  }

  button:active { transform: scale(.95); }

  .btn-sm {
    width: 30px;
    height: 30px;
    background: #2a2a44;
    color: var(--text);
    font-size: 1rem;
    border: 1px solid rgba(255,255,255,.08);
  }

  .btn-spin {
    padding: .65rem 2.5rem;
    font-size: 1.1rem;
    text-transform: uppercase;
    letter-spacing: .12em;
    background: linear-gradient(135deg, var(--accent), #007cf0);
    color: #000;
    box-shadow: 0 0 20px rgba(0,229,255,.3);
  }

  .btn-spin:disabled {
    opacity: .4;
    cursor: not-allowed;
    box-shadow: none;
  }

  .btn-spin:not(:disabled):hover {
    box-shadow: 0 0 30px rgba(0,229,255,.5);
  }

  /* Message area */
  .message {
    text-align: center;
    min-height: 3.6rem;
    margin-top: .8rem;
    padding: .4rem;
  }

  .message .result {
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: .15rem;
  }

  .message .flavor {
    font-size: .78rem;
    color: #999;
    font-style: italic;
  }

  .win { color: var(--gold); }
  .lose { color: var(--danger); }
  .jackpot { color: var(--gold); animation: glow .4s ease-in-out 3; }

  @keyframes glow {
    50% { text-shadow: 0 0 18px rgba(255,215,0,.9); }
  }

  /* Paytable */
  .paytable-toggle {
    margin-top: 1rem;
    font-size: .75rem;
    color: var(--accent);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    font-family: inherit;
  }

  .paytable {
    display: none;
    margin-top: .6rem;
    background: var(--panel);
    border: 1px solid rgba(0,229,255,.1);
    border-radius: .5rem;
    padding: .8rem 1.2rem;
    font-size: .78rem;
    max-width: 360px;
  }

  .paytable.open { display: block; }

  .paytable table {
    width: 100%;
    border-collapse: collapse;
  }

  .paytable th {
    text-align: left;
    color: var(--accent);
    padding-bottom: .3rem;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }

  .paytable td {
    padding: .25rem 0;
  }

  .paytable td:last-child {
    text-align: right;
    color: var(--gold);
    font-weight: 600;
  }

  /* Particle canvas */
  #confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99;
  }

  /* Responsive */
  @media (max-width: 420px) {
    h1 { font-size: 1.4rem; }
    .reel-window { width: 80px; height: 100px; }
    .reel-cell { width: 80px; height: 100px; font-size: 2.4rem; }
    .machine { padding: 1rem 1rem .8rem; }
    .btn-spin { padding: .55rem 1.6rem; font-size: .95rem; }
  }
</style>
</head>
<body>

<h1>Token Burner 3000</h1>
<p class="subtitle">Where AI dreams go to get hallucinated</p>

<div class="token-bar">
  <span class="icon">🪙</span>
  <span class="amount" id="tokens">100</span>
  <span class="label">tokens</span>
</div>

<div class="machine">
  <div class="reels" id="reels">
    <div class="reel-window"><div class="reel-strip" id="reel0"></div></div>
    <div class="reel-window"><div class="reel-strip" id="reel1"></div></div>
    <div class="reel-window"><div class="reel-strip" id="reel2"></div></div>
  </div>

  <div class="controls">
    <div class="bet-group">
      <span class="label">Bet</span>
      <div class="bet-controls">
        <button class="btn-sm" id="betDown">−</button>
        <span class="bet-val" id="betDisplay">5</span>
        <button class="btn-sm" id="betUp">+</button>
      </div>
    </div>
    <button class="btn-spin" id="spinBtn">SPIN</button>
  </div>

  <div class="message" id="message"></div>
</div>

<button class="paytable-toggle" id="paytableToggle">Paytable &amp; Rules</button>
<div class="paytable" id="paytable">
  <table>
    <tr><th>Combo</th><th>Payout</th></tr>
    <tr><td>🤖🤖🤖 — Singularity</td><td>×20</td></tr>
    <tr><td>🧠🧠🧠 — Galaxy Brain</td><td>×15</td></tr>
    <tr><td>🔥🔥🔥 — GPU Meltdown</td><td>×12</td></tr>
    <tr><td>💎💎💎 — Rare Token</td><td>×10</td></tr>
    <tr><td>🐛🐛🐛 — Bug Bounty</td><td>×8</td></tr>
    <tr><td>📎📎📎 — Clippy Rises</td><td>×6</td></tr>
    <tr><td>Any 3 match</td><td>×5</td></tr>
    <tr><td>Any 2 match</td><td>×2</td></tr>
  </table>
</div>

<canvas id="confetti"></canvas>

<script>
(function () {
  // ── Symbols & weights ──
  const SYMBOLS = [
    { emoji: '🤖', name: 'Robot',  weight: 4  },
    { emoji: '🧠', name: 'Brain',  weight: 5  },
    { emoji: '🔥', name: 'Fire',   weight: 6  },
    { emoji: '💎', name: 'Gem',    weight: 7  },
    { emoji: '🐛', name: 'Bug',    weight: 9  },
    { emoji: '📎', name: 'Clippy', weight: 10 },
    { emoji: '💀', name: 'Skull',  weight: 12 },
    { emoji: '🌀', name: 'Spiral', weight: 12 },
  ];

  // Build weighted pool
  const POOL = [];
  for (const s of SYMBOLS) {
    for (let i = 0; i < s.weight; i++) POOL.push(s);
  }

  // ── Special payouts (3-of-a-kind) ──
  const SPECIAL_MULT = {
    '🤖': 20,
    '🧠': 15,
    '🔥': 12,
    '💎': 10,
    '🐛': 8,
    '📎': 6,
  };

  // ── Flavor text ──
  const WIN_LINES = [
    "The model hallucinated in your favor!",
    "Prompt engineering pays off!",
    "Your gradient descended into profit!",
    "Even GPT couldn't predict this win!",
    "The attention head is attending to your wallet!",
    "Fine-tuned for fortune!",
    "Your loss function just became a win function!",
  ];

  const LOSE_LINES = [
    "Tokens burned. Just like your API bill.",
    "The AI giveth, the AI taketh away.",
    "That's what you get for trusting a stochastic parrot.",
    "Your request was processed. Funds were not returned.",
    "Overfitting to bad luck.",
    "Model confidence was high. Model was wrong.",
    "Training data did not include 'winning'.",
    "Rate limited by reality.",
    "Context window full of regret.",
  ];

  const JACKPOT_LINES = [
    "SINGULARITY ACHIEVED! The machines pay tribute!",
    "GALAXY BRAIN MOMENT! You out-thought the transformer!",
    "GPU MELTDOWN! NVIDIA stock rises with your winnings!",
    "RARE TOKEN MINED! The embedding space smiles upon you!",
    "BUG BOUNTY! You found three bugs and got paid!",
    "CLIPPY RISES! 'It looks like you're winning!'",
  ];

  const BROKE_LINES = [
    "Bankrupt. Your context window is now empty in every sense.",
    "Zero tokens left. Just like a free-tier API key at month end.",
    "You've been deprecated. Refresh to re-deploy with 100 tokens.",
    "Out of tokens. The model refuses to generate further.",
  ];

  // ── State ──
  let tokens = 100;
  let bet = 5;
  let spinning = false;

  // ── DOM refs ──
  const tokensEl = document.getElementById('tokens');
  const betEl = document.getElementById('betDisplay');
  const spinBtn = document.getElementById('spinBtn');
  const msgEl = document.getElementById('message');
  const reelEls = [0, 1, 2].map(i => document.getElementById('reel' + i));

  // ── Audio via Web Audio API ──
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let actx;
  function ensureAudio() {
    if (!actx) actx = new AudioCtx();
  }

  function playTone(freq, dur, type = 'square', vol = 0.08) {
    ensureAudio();
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start();
    o.stop(actx.currentTime + dur);
  }

  function sfxSpin() {
    for (let i = 0; i < 3; i++) setTimeout(() => playTone(220 + i * 80, 0.06), i * 60);
  }

  function sfxStop() { playTone(440, 0.1, 'sine', 0.1); }

  function sfxWin() {
    [523, 659, 784].forEach((f, i) => setTimeout(() => playTone(f, 0.15, 'sine', 0.12), i * 100));
  }

  function sfxJackpot() {
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.25, 'sine', 0.14), i * 120));
  }

  function sfxLose() { playTone(180, 0.25, 'sawtooth', 0.06); }

  // ── Reel rendering ──
  function pickRandom() {
    return POOL[Math.floor(Math.random() * POOL.length)];
  }

  function buildStrip(result) {
    // 3 cells: padding-top, result, padding-bottom (we show center)
    const above = pickRandom();
    const below = pickRandom();
    return [above, result, below];
  }

  function renderReel(el, cells, settled) {
    el.innerHTML = '';
    for (const c of cells) {
      const div = document.createElement('div');
      div.className = 'reel-cell';
      div.textContent = c.emoji;
      el.appendChild(div);
    }
    // Position so middle cell is visible
    el.style.transition = settled ? 'none' : 'transform .1s linear';
    el.style.transform = 'translateY(-120px)';
  }

  // ── Initialize reels ──
  function initReels() {
    for (const el of reelEls) {
      const cells = [pickRandom(), pickRandom(), pickRandom()];
      renderReel(el, cells, true);
    }
  }
  initReels();

  // ── Bet controls ──
  document.getElementById('betDown').addEventListener('click', () => {
    if (spinning) return;
    bet = Math.max(1, bet - 1);
    betEl.textContent = bet;
  });

  document.getElementById('betUp').addEventListener('click', () => {
    if (spinning) return;
    bet = Math.min(tokens, Math.min(50, bet + 1));
    betEl.textContent = bet;
  });

  // ── Paytable toggle ──
  document.getElementById('paytableToggle').addEventListener('click', () => {
    document.getElementById('paytable').classList.toggle('open');
  });

  // ── Update token display ──
  function updateTokens(val) {
    tokens = val;
    tokensEl.textContent = tokens;
    tokensEl.classList.add('pop');
    setTimeout(() => tokensEl.classList.remove('pop'), 150);
  }

  // ── Confetti ──
  const confettiCanvas = document.getElementById('confetti');
  const ctx = confettiCanvas.getContext('2d');
  let particles = [];

  function resizeCanvas() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function spawnConfetti(count) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * confettiCanvas.width,
        y: -10 - Math.random() * 40,
        vx: (Math.random() - 0.5) * 4,
        vy: 2 + Math.random() * 4,
        size: 4 + Math.random() * 6,
        color: ['#ffd700', '#00e5ff', '#ff4060', '#7c4dff', '#00e676'][Math.floor(Math.random() * 5)],
        life: 1,
      });
    }
  }

  function tickConfetti() {
    ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    particles = particles.filter(p => p.life > 0);
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.1;
      p.life -= 0.008;
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    if (particles.length) requestAnimationFrame(tickConfetti);
  }

  // ── Spin logic ──
  spinBtn.addEventListener('click', spin);

  // Keyboard: spacebar to spin
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !spinning) { e.preventDefault(); spin(); }
  });

  function spin() {
    if (spinning) return;
    if (tokens <= 0) return;
    if (bet > tokens) bet = tokens;
    betEl.textContent = bet;

    spinning = true;
    spinBtn.disabled = true;
    msgEl.innerHTML = '';

    // Deduct bet
    updateTokens(tokens - bet);
    sfxSpin();

    // Determine results
    const results = [pickRandom(), pickRandom(), pickRandom()];

    // Animate each reel with staggered stop
    const SPIN_DURATION = [600, 900, 1200]; // ms per reel
    const TICK = 70; // ms per tick animation

    reelEls.forEach((el, i) => {
      let elapsed = 0;
      const interval = setInterval(() => {
        const randomCells = [pickRandom(), pickRandom(), pickRandom()];
        renderReel(el, randomCells, false);
        elapsed += TICK;
        if (elapsed >= SPIN_DURATION[i]) {
          clearInterval(interval);
          const strip = buildStrip(results[i]);
          renderReel(el, strip, true);
          sfxStop();

          // After last reel stops, evaluate
          if (i === 2) {
            setTimeout(() => evaluate(results), 200);
          }
        }
      }, TICK);
    });
  }

  function evaluate(results) {
    const emojis = results.map(r => r.emoji);
    const [a, b, c] = emojis;

    let multiplier = 0;
    let isJackpot = false;
    let resultText = '';
    let flavorText = '';

    if (a === b && b === c) {
      // Three of a kind
      multiplier = SPECIAL_MULT[a] || 5;
      isJackpot = true;

      const idx = SYMBOLS.findIndex(s => s.emoji === a);
      resultText = `${a}${a}${a} — ×${multiplier}!`;
      flavorText = JACKPOT_LINES[idx] || JACKPOT_LINES[0];
    } else if (a === b || b === c || a === c) {
      // Two of a kind
      multiplier = 2;
      resultText = `Two match! ×2`;
      flavorText = WIN_LINES[Math.floor(Math.random() * WIN_LINES.length)];
    }

    if (multiplier > 0) {
      const winnings = bet * multiplier;
      updateTokens(tokens + winnings);

      msgEl.innerHTML = `
        <div class="result ${isJackpot ? 'jackpot' : 'win'}">${resultText} — +${winnings} tokens!</div>
        <div class="flavor">${flavorText}</div>
      `;

      if (isJackpot) {
        sfxJackpot();
        spawnConfetti(80);
        requestAnimationFrame(tickConfetti);
      } else {
        sfxWin();
        spawnConfetti(25);
        requestAnimationFrame(tickConfetti);
      }
    } else {
      msgEl.innerHTML = `
        <div class="result lose">No match — −${bet} tokens</div>
        <div class="flavor">${LOSE_LINES[Math.floor(Math.random() * LOSE_LINES.length)]}</div>
      `;
      sfxLose();
    }

    // Check broke
    if (tokens <= 0) {
      setTimeout(() => {
        msgEl.innerHTML = `
          <div class="result lose">${BROKE_LINES[Math.floor(Math.random() * BROKE_LINES.length)]}</div>
          <div class="flavor">Click SPIN to re-deploy with 100 tokens.</div>
        `;
        spinBtn.onclick = () => {
          updateTokens(100);
          bet = 5;
          betEl.textContent = bet;
          msgEl.innerHTML = '';
          spinBtn.onclick = null;
          spinBtn.addEventListener('click', spin);
          spinning = false;
          spinBtn.disabled = false;
        };
        spinning = false;
        spinBtn.disabled = false;
      }, 1500);
      return;
    }

    spinning = false;
    spinBtn.disabled = false;
  }
})();
</script>
</body>
</html>
