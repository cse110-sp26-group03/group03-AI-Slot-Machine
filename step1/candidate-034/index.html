<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Token Slot Machine</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --bg:#0d0f1a;
    --panel:#161929;
    --accent:#7c3aed;
    --accent-glow:#a855f7;
    --gold:#facc15;
    --text:#e2e8f0;
    --muted:#64748b;
    --reel-bg:#0f1120;
    --win:#22c55e;
    --lose:#ef4444;
  }

  body{
    font-family:'Segoe UI',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }

  /* Decorative background grid */
  body::before{
    content:'';position:fixed;inset:0;
    background:
      linear-gradient(rgba(124,58,237,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(124,58,237,.05) 1px,transparent 1px);
    background-size:40px 40px;
    pointer-events:none;
    z-index:0;
  }

  h1{
    font-size:2.2rem;
    text-align:center;
    margin-bottom:.25rem;
    background:linear-gradient(135deg,var(--accent-glow),var(--gold));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
    text-shadow:none;
    position:relative;z-index:1;
  }
  .subtitle{
    text-align:center;font-size:.95rem;color:var(--muted);margin-bottom:1.5rem;
    position:relative;z-index:1;
  }

  .machine{
    background:var(--panel);
    border:2px solid rgba(124,58,237,.3);
    border-radius:20px;
    padding:2rem 2.5rem 1.5rem;
    box-shadow:0 0 60px rgba(124,58,237,.15),inset 0 1px 0 rgba(255,255,255,.05);
    position:relative;z-index:1;
    max-width:480px;width:90vw;
  }

  /* Token balance */
  .balance{
    text-align:center;margin-bottom:1.2rem;
  }
  .balance-label{font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
  .balance-value{
    font-size:2.4rem;font-weight:800;color:var(--gold);
    text-shadow:0 0 18px rgba(250,204,21,.3);
    transition:transform .15s;
  }
  .balance-value.bump{transform:scale(1.15)}

  /* Reels */
  .reels{
    display:flex;gap:12px;justify-content:center;margin-bottom:1.2rem;
  }
  .reel-window{
    width:100px;height:110px;
    background:var(--reel-bg);
    border:2px solid rgba(124,58,237,.25);
    border-radius:14px;
    overflow:hidden;
    position:relative;
  }
  .reel-window::before,.reel-window::after{
    content:'';position:absolute;left:0;right:0;height:28px;z-index:2;pointer-events:none;
  }
  .reel-window::before{top:0;background:linear-gradient(var(--reel-bg),transparent)}
  .reel-window::after{bottom:0;background:linear-gradient(transparent,var(--reel-bg))}

  .reel-strip{
    display:flex;flex-direction:column;align-items:center;
    transition:transform .4s cubic-bezier(.2,.8,.3,1);
    will-change:transform;
  }
  .reel-strip.spinning{
    transition:none;
  }
  .reel-cell{
    width:100px;height:110px;
    display:flex;align-items:center;justify-content:center;
    font-size:3.2rem;
    flex-shrink:0;
    user-select:none;
  }

  /* Result banner */
  .result{
    text-align:center;min-height:2rem;margin-bottom:.8rem;
    font-size:1.1rem;font-weight:700;
    transition:opacity .3s;
  }
  .result.win{color:var(--win)}
  .result.lose{color:var(--lose)}
  .result.jackpot{
    color:var(--gold);
    font-size:1.4rem;
    animation:jackpot-pulse .5s ease-in-out 3;
  }
  @keyframes jackpot-pulse{
    0%,100%{transform:scale(1)}50%{transform:scale(1.12)}
  }

  /* Bet controls */
  .bet-row{
    display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:1rem;
  }
  .bet-row label{font-size:.85rem;color:var(--muted)}
  .bet-btn{
    width:34px;height:34px;border-radius:8px;border:1px solid rgba(124,58,237,.4);
    background:var(--reel-bg);color:var(--text);font-size:1.1rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s;
  }
  .bet-btn:hover{background:rgba(124,58,237,.25)}
  .bet-amount{
    font-size:1.3rem;font-weight:700;min-width:50px;text-align:center;color:var(--gold);
  }

  /* Spin button */
  .spin-btn{
    display:block;width:100%;padding:.9rem;
    border:none;border-radius:12px;
    font-size:1.2rem;font-weight:700;
    cursor:pointer;
    background:linear-gradient(135deg,var(--accent),#9333ea);
    color:#fff;
    box-shadow:0 4px 20px rgba(124,58,237,.4);
    transition:transform .1s,box-shadow .2s;
    text-transform:uppercase;letter-spacing:.06em;
  }
  .spin-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 28px rgba(124,58,237,.5)}
  .spin-btn:active:not(:disabled){transform:translateY(1px)}
  .spin-btn:disabled{opacity:.45;cursor:not-allowed}

  /* Paytable */
  .paytable{
    margin-top:1.2rem;
    border-top:1px solid rgba(124,58,237,.15);
    padding-top:1rem;
  }
  .paytable summary{
    font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);
    cursor:pointer;text-align:center;list-style:none;
  }
  .paytable summary::after{content:' ▾'}
  .paytable[open] summary::after{content:' ▴'}
  .paytable-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;
    margin-top:.7rem;font-size:.82rem;
  }
  .paytable-grid .combo{color:var(--text)}
  .paytable-grid .payout{color:var(--gold);text-align:right}

  /* Toast messages */
  .toast{
    position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--accent);
    border-radius:10px;padding:.65rem 1.4rem;
    font-size:.9rem;color:var(--text);
    opacity:0;transition:opacity .3s;pointer-events:none;z-index:10;
  }
  .toast.show{opacity:1}

  /* Confetti canvas */
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:20}

  /* Responsive */
  @media(max-width:500px){
    .machine{padding:1.5rem 1rem 1rem}
    .reel-window{width:80px;height:90px}
    .reel-cell{width:80px;height:90px;font-size:2.5rem}
    h1{font-size:1.6rem}
    .balance-value{font-size:1.8rem}
  }
</style>
</head>
<body>

<h1>AI Token Slot Machine</h1>
<p class="subtitle">Feed the machine. Win tokens. Lose your mind.</p>

<div class="machine">
  <div class="balance">
    <div class="balance-label">Token Balance</div>
    <div class="balance-value" id="balance">1000</div>
  </div>

  <div class="reels" id="reels">
    <div class="reel-window"><div class="reel-strip" id="reel0"></div></div>
    <div class="reel-window"><div class="reel-strip" id="reel1"></div></div>
    <div class="reel-window"><div class="reel-strip" id="reel2"></div></div>
  </div>

  <div class="result" id="result">&nbsp;</div>

  <div class="bet-row">
    <label>BET</label>
    <button class="bet-btn" id="betDown">−</button>
    <span class="bet-amount" id="betDisplay">10</span>
    <button class="bet-btn" id="betUp">+</button>
  </div>

  <button class="spin-btn" id="spinBtn">🎰 Spend Tokens</button>

  <details class="paytable">
    <summary>Paytable</summary>
    <div class="paytable-grid" id="paytableGrid"></div>
  </details>
</div>

<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>

<!-- Sound effects via Web Audio API -->
<script>
(function(){
  "use strict";

  /* ─── SYMBOLS ─── */
  const SYMBOLS = [
    { icon: "🤖", name: "Robot",        weight: 8  },
    { icon: "🧠", name: "Brain",        weight: 7  },
    { icon: "💬", name: "ChatBubble",   weight: 7  },
    { icon: "⚡", name: "Lightning",    weight: 6  },
    { icon: "🔥", name: "Fire",         weight: 5  },
    { icon: "💎", name: "Diamond",      weight: 3  },
    { icon: "🦾", name: "MechArm",      weight: 4  },
    { icon: "👁️", name: "Eye",          weight: 5  },
    { icon: "🪙", name: "Token",        weight: 6  },
    { icon: "💀", name: "Skull",        weight: 4  },
  ];

  /* Weighted reel strip (order randomised once) */
  function buildStrip(){
    const strip = [];
    SYMBOLS.forEach(s => { for(let i=0;i<s.weight;i++) strip.push(s); });
    for(let i=strip.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [strip[i],strip[j]]=[strip[j],strip[i]];
    }
    return strip;
  }

  const strips = [buildStrip(), buildStrip(), buildStrip()];

  /* ─── PAYOUTS ─── */
  const TRIPLE_PAY = {
    "🤖": 5,   // 3 robots
    "🧠": 8,   // 3 brains
    "💬": 6,   // 3 chat bubbles
    "⚡": 10,  // 3 lightning
    "🔥": 12,  // 3 fire
    "💎": 50,  // 3 diamonds — JACKPOT
    "🦾": 15,  // 3 mech arms
    "👁️": 7,  // 3 eyes
    "🪙": 20,  // 3 tokens
    "💀": 0,   // 3 skulls — lose everything bet
  };
  const ANY_TWO_PAY = 2; // any two matching symbols pays 2x

  /* ─── AI QUIPS ─── */
  const WIN_QUIPS = [
    "The AI giveth… for now.",
    "GPT would never.",
    "Your prompt was accepted!",
    "Tokens generated successfully.",
    "Model output: PROFIT.",
    "You've beaten the transformer!",
    "Context window: WINNER.",
    "Training data says: nice.",
  ];
  const LOSE_QUIPS = [
    "Hallucination detected: you thought you'd win.",
    "Your tokens have been fine-tuned away.",
    "Error 402: Insufficient luck.",
    "The model rejected your request.",
    "Rate limited by fate.",
    "Token budget exceeded.",
    "Your prompt was too vague.",
    "RLHF says: try again.",
    "Catastrophic forgetting… of your tokens.",
    "Attention mechanism found nothing useful.",
  ];
  const JACKPOT_QUIPS = [
    "💎 JACKPOT! The singularity is here! 💎",
    "💎 AGI ACHIEVED — ALL TOKENS ARE YOURS! 💎",
    "💎 You broke the alignment! MASSIVE WIN! 💎",
  ];
  const SKULL_QUIPS = [
    "💀 MODEL COLLAPSE! Bet obliterated! 💀",
    "💀 Catastrophic failure — tokens destroyed! 💀",
    "💀 The AI has become self-aware… and angry! 💀",
  ];

  function randomFrom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  /* ─── AUDIO (Web Audio API) ─── */
  let audioCtx;
  function getAudioCtx(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playTone(freq, duration, type="square", gain=0.08){
    try{
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      g.gain.setValueAtTime(gain, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(g).connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + duration);
    }catch(e){}
  }

  function sfxSpin(){ playTone(220,.08); setTimeout(()=>playTone(330,.08),60); setTimeout(()=>playTone(440,.08),120); }
  function sfxStop(){ playTone(660,.12,"sine",0.06); }
  function sfxWin(){ [0,100,200,300].forEach((d,i)=>setTimeout(()=>playTone(520+i*80,.15,"sine",0.07),d)); }
  function sfxJackpot(){ [0,120,240,360,480,600].forEach((d,i)=>setTimeout(()=>playTone(400+i*100,.2,"sine",0.09),d)); }
  function sfxLose(){ playTone(180,.25,"sawtooth",0.05); }
  function sfxSkull(){ playTone(100,.4,"sawtooth",0.07); setTimeout(()=>playTone(80,.5,"sawtooth",0.06),200); }

  /* ─── STATE ─── */
  let balance = 1000;
  let bet = 10;
  let spinning = false;
  const BET_STEP = 10;
  const MIN_BET = 10;
  const MAX_BET = 500;

  const balanceEl = document.getElementById("balance");
  const resultEl  = document.getElementById("result");
  const betEl     = document.getElementById("betDisplay");
  const spinBtn   = document.getElementById("spinBtn");
  const reelEls   = [0,1,2].map(i => document.getElementById("reel"+i));

  /* ─── RENDER REELS ─── */
  // Each reel strip is rendered as a vertical list; we translate to show the "stopped" symbol
  function renderReelStrip(reelEl, strip){
    reelEl.innerHTML = "";
    strip.forEach(s => {
      const cell = document.createElement("div");
      cell.className = "reel-cell";
      cell.textContent = s.icon;
      reelEl.appendChild(cell);
    });
  }
  strips.forEach((s,i) => renderReelStrip(reelEls[i], s));

  // Centre on a random starting index
  const currentIndex = [0,0,0];
  function snapTo(reelIdx, symbolIdx){
    const cellH = reelEls[reelIdx].parentElement.offsetHeight;
    reelEls[reelIdx].style.transition = "none";
    reelEls[reelIdx].style.transform = `translateY(${-symbolIdx * cellH}px)`;
    currentIndex[reelIdx] = symbolIdx;
  }
  [0,1,2].forEach(i => snapTo(i, Math.floor(Math.random()*strips[i].length)));

  /* ─── SPIN LOGIC ─── */
  function spin(){
    if(spinning) return;
    if(balance < bet){ showToast("Not enough tokens! You need more inference budget."); return; }

    spinning = true;
    spinBtn.disabled = true;
    resultEl.textContent = "\u00A0";
    resultEl.className = "result";
    balance -= bet;
    updateBalance();
    sfxSpin();

    // Pick results
    const results = strips.map(strip => Math.floor(Math.random()*strip.length));

    // Animate each reel with staggered stop
    const SPIN_DURATION = [600, 900, 1200]; // ms per reel
    const SPINS = [3, 4, 5]; // full loops per reel

    reelEls.forEach((el, i) => {
      const cellH = el.parentElement.offsetHeight;
      const totalCells = strips[i].length;
      const target = results[i];
      const fullLoopPx = totalCells * cellH;
      const targetPx = target * cellH;
      const totalPx = SPINS[i] * fullLoopPx + targetPx;

      // Kick off rapid spin
      el.style.transition = "none";
      el.style.transform = `translateY(${-currentIndex[i]*cellH}px)`;

      // Use requestAnimationFrame for smoother start
      requestAnimationFrame(() => {
        el.style.transition = `transform ${SPIN_DURATION[i]}ms cubic-bezier(.15,.6,.25,1)`;
        el.style.transform = `translateY(${-totalPx}px)`;
      });

      // After animation, snap to actual position (loop)
      setTimeout(() => {
        el.style.transition = "none";
        el.style.transform = `translateY(${-targetPx}px)`;
        currentIndex[i] = target;
        sfxStop();
      }, SPIN_DURATION[i] + 50);
    });

    // Evaluate after last reel stops
    setTimeout(() => {
      evaluate(results);
      spinning = false;
      spinBtn.disabled = false;
    }, SPIN_DURATION[2] + 100);
  }

  /* ─── EVALUATE ─── */
  function evaluate(results){
    const icons = results.map((idx,i) => strips[i][idx].icon);
    const [a,b,c] = icons;

    if(a === b && b === c){
      // Triple match
      if(a === "💀"){
        // Skull triple — lose bet (already deducted)
        resultEl.className = "result lose";
        resultEl.textContent = randomFrom(SKULL_QUIPS);
        sfxSkull();
        return;
      }
      const multiplier = TRIPLE_PAY[a] || 5;
      const winnings = bet * multiplier;
      balance += winnings;
      updateBalance(true);

      if(a === "💎"){
        resultEl.className = "result jackpot";
        resultEl.textContent = randomFrom(JACKPOT_QUIPS);
        sfxJackpot();
        launchConfetti();
      } else {
        resultEl.className = "result win";
        resultEl.textContent = `${a}${a}${a} ${multiplier}x — +${winnings} tokens! ${randomFrom(WIN_QUIPS)}`;
        sfxWin();
      }
    } else if(a === b || b === c || a === c){
      // Two matching
      const winnings = bet * ANY_TWO_PAY;
      balance += winnings;
      updateBalance(true);
      resultEl.className = "result win";
      resultEl.textContent = `Pair! +${winnings} tokens. ${randomFrom(WIN_QUIPS)}`;
      sfxWin();
    } else {
      // No match
      resultEl.className = "result lose";
      resultEl.textContent = randomFrom(LOSE_QUIPS);
      sfxLose();
    }

    // Broke?
    if(balance <= 0){
      setTimeout(() => {
        balance = 500;
        updateBalance();
        showToast("🤖 The AI took pity on you. Here's 500 charity tokens.");
      }, 1200);
    }
  }

  /* ─── UI HELPERS ─── */
  function updateBalance(animate){
    balanceEl.textContent = balance.toLocaleString();
    if(animate){
      balanceEl.classList.add("bump");
      setTimeout(()=>balanceEl.classList.remove("bump"),200);
    }
  }

  document.getElementById("betUp").addEventListener("click", () => {
    if(bet < MAX_BET) bet = Math.min(bet + BET_STEP, MAX_BET);
    betEl.textContent = bet;
  });
  document.getElementById("betDown").addEventListener("click", () => {
    if(bet > MIN_BET) bet = Math.max(bet - BET_STEP, MIN_BET);
    betEl.textContent = bet;
  });

  spinBtn.addEventListener("click", spin);

  // Spacebar to spin
  document.addEventListener("keydown", e => {
    if(e.code === "Space" && !spinning){ e.preventDefault(); spin(); }
  });

  /* ─── TOAST ─── */
  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(()=>t.classList.remove("show"),3000);
  }

  /* ─── CONFETTI ─── */
  function launchConfetti(){
    const canvas = document.getElementById("confetti");
    const ctx2 = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const pieces = [];
    const colors = ["#facc15","#a855f7","#22c55e","#3b82f6","#ef4444","#f97316"];
    for(let i=0;i<120;i++){
      pieces.push({
        x: canvas.width/2 + (Math.random()-.5)*200,
        y: canvas.height/2,
        vx: (Math.random()-.5)*14,
        vy: -Math.random()*16 - 4,
        w: Math.random()*8+4,
        h: Math.random()*6+2,
        color: colors[Math.floor(Math.random()*colors.length)],
        rot: Math.random()*Math.PI*2,
        rv: (Math.random()-.5)*.3,
      });
    }
    let frame=0;
    function draw(){
      ctx2.clearRect(0,0,canvas.width,canvas.height);
      let alive=false;
      pieces.forEach(p=>{
        p.x+=p.vx; p.y+=p.vy; p.vy+=.35; p.rot+=p.rv;
        if(p.y < canvas.height+20) alive=true;
        ctx2.save();
        ctx2.translate(p.x,p.y);
        ctx2.rotate(p.rot);
        ctx2.fillStyle=p.color;
        ctx2.fillRect(-p.w/2,-p.h/2,p.w,p.h);
        ctx2.restore();
      });
      frame++;
      if(alive && frame<180) requestAnimationFrame(draw);
      else ctx2.clearRect(0,0,canvas.width,canvas.height);
    }
    draw();
  }

  /* ─── PAYTABLE ─── */
  const grid = document.getElementById("paytableGrid");
  SYMBOLS.forEach(s => {
    const mult = TRIPLE_PAY[s.icon];
    const label = mult === 0 ? "LOSE BET" : `${mult}x`;
    grid.innerHTML += `<span class="combo">${s.icon}${s.icon}${s.icon}</span><span class="payout">${label}</span>`;
  });
  grid.innerHTML += `<span class="combo">Any Pair</span><span class="payout">2x</span>`;

})();
</script>
</body>
</html>
