<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Token Slot Machine</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a1a;
    font-family: 'Orbitron', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      linear-gradient(rgba(0,255,170,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,170,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridScroll 20s linear infinite;
    z-index: 0;
  }

  @keyframes gridScroll {
    to { transform: translateY(40px); }
  }

  .machine {
    position: relative;
    z-index: 1;
    background: linear-gradient(145deg, #1a1a2e, #16213e);
    border: 3px solid #00ffa8;
    border-radius: 24px;
    padding: 32px 40px 40px;
    box-shadow:
      0 0 40px rgba(0,255,168,0.15),
      0 0 80px rgba(0,255,168,0.05),
      inset 0 1px 0 rgba(255,255,255,0.05);
    max-width: 520px;
    width: 95vw;
  }

  .machine-title {
    text-align: center;
    font-size: 1.5rem;
    font-weight: 900;
    color: #00ffa8;
    text-shadow: 0 0 20px rgba(0,255,168,0.5);
    margin-bottom: 4px;
    letter-spacing: 3px;
  }

  .machine-subtitle {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: #888;
    margin-bottom: 24px;
    letter-spacing: 1px;
  }

  /* Token balance */
  .balance-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(0,0,0,0.4);
    border: 1px solid #333;
    border-radius: 12px;
    padding: 12px 20px;
    margin-bottom: 20px;
  }

  .balance-label {
    font-size: 0.65rem;
    color: #aaa;
    letter-spacing: 2px;
  }

  .balance-amount {
    font-size: 1.4rem;
    font-weight: 700;
    color: #ffd700;
    text-shadow: 0 0 10px rgba(255,215,0,0.4);
    transition: transform 0.3s;
  }

  .balance-amount.bump {
    animation: bumpBalance 0.4s ease;
  }

  @keyframes bumpBalance {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }

  /* Bet controls */
  .bet-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .bet-row label {
    font-size: 0.65rem;
    color: #aaa;
    letter-spacing: 2px;
  }

  .bet-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid #00ffa8;
    background: rgba(0,255,168,0.1);
    color: #00ffa8;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-family: 'Orbitron', sans-serif;
  }

  .bet-btn:hover {
    background: rgba(0,255,168,0.25);
    box-shadow: 0 0 12px rgba(0,255,168,0.3);
  }

  .bet-display {
    font-size: 1.1rem;
    font-weight: 700;
    color: #fff;
    min-width: 50px;
    text-align: center;
  }

  /* Reel window */
  .reel-window {
    background: rgba(0,0,0,0.6);
    border: 2px solid #333;
    border-radius: 16px;
    padding: 16px 12px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }

  /* Win line indicator */
  .reel-window::after {
    content: '';
    position: absolute;
    left: 8px;
    right: 8px;
    top: 50%;
    height: 2px;
    background: rgba(0,255,168,0.15);
    transform: translateY(-1px);
    border-radius: 1px;
    z-index: 2;
    pointer-events: none;
  }

  .reels {
    display: flex;
    justify-content: center;
    gap: 8px;
  }

  .reel-container {
    width: 110px;
    height: 240px;
    overflow: hidden;
    border-radius: 10px;
    background: rgba(0,0,0,0.5);
    border: 1px solid #222;
    position: relative;
  }

  /* Fade edges */
  .reel-container::before,
  .reel-container::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 60px;
    z-index: 1;
    pointer-events: none;
  }
  .reel-container::before {
    top: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
  }
  .reel-container::after {
    bottom: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
  }

  .reel-strip {
    display: flex;
    flex-direction: column;
    transition: transform 0.6s cubic-bezier(0.15, 0.8, 0.3, 1.02);
  }

  .reel-strip.spinning {
    transition: none;
  }

  .reel-cell {
    width: 110px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    user-select: none;
    flex-shrink: 0;
  }

  .reel-cell .symbol-label {
    font-size: 0.5rem;
    font-family: 'JetBrains Mono', monospace;
    color: #666;
    text-align: center;
    display: block;
    margin-top: 2px;
  }

  .reel-cell .symbol-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Spin button */
  .spin-btn {
    display: block;
    width: 100%;
    padding: 16px;
    border: 2px solid #00ffa8;
    border-radius: 14px;
    background: linear-gradient(145deg, rgba(0,255,168,0.15), rgba(0,255,168,0.05));
    color: #00ffa8;
    font-family: 'Orbitron', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 4px;
    cursor: pointer;
    transition: all 0.3s;
    text-transform: uppercase;
  }

  .spin-btn:hover:not(:disabled) {
    background: linear-gradient(145deg, rgba(0,255,168,0.3), rgba(0,255,168,0.1));
    box-shadow: 0 0 30px rgba(0,255,168,0.2);
    transform: translateY(-1px);
  }

  .spin-btn:active:not(:disabled) {
    transform: translateY(1px);
  }

  .spin-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    border-color: #555;
    color: #555;
  }

  /* Message area */
  .message {
    text-align: center;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: #ccc;
    margin-top: 16px;
    line-height: 1.5;
    padding: 0 8px;
  }

  .message.win {
    color: #ffd700;
    text-shadow: 0 0 10px rgba(255,215,0,0.4);
    font-weight: 700;
  }

  .message.lose {
    color: #ff6b6b;
  }

  .message.jackpot {
    color: #ff00ff;
    text-shadow: 0 0 20px rgba(255,0,255,0.5);
    font-size: 0.85rem;
    font-weight: 700;
    animation: jackpotPulse 0.5s ease infinite alternate;
  }

  @keyframes jackpotPulse {
    to { text-shadow: 0 0 30px rgba(255,0,255,0.8); transform: scale(1.03); }
  }

  /* Paytable */
  .paytable-toggle {
    display: block;
    margin: 16px auto 0;
    background: none;
    border: none;
    color: #666;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    cursor: pointer;
    letter-spacing: 1px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .paytable-toggle:hover { color: #aaa; }

  .paytable {
    display: none;
    margin-top: 12px;
    background: rgba(0,0,0,0.3);
    border: 1px solid #222;
    border-radius: 10px;
    padding: 14px 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: #999;
    line-height: 2;
  }

  .paytable.open { display: block; }

  .paytable-row {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #1a1a2e;
    padding: 2px 0;
  }

  .paytable-row:last-child { border: none; }

  .paytable-mult { color: #ffd700; font-weight: 700; }

  /* Win particles */
  .particle {
    position: fixed;
    pointer-events: none;
    font-size: 1.2rem;
    z-index: 100;
    animation: particleFly 1.5s ease-out forwards;
  }

  @keyframes particleFly {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-200px) scale(0.3); }
  }

  /* Bankrupt overlay */
  .bankrupt-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    border-radius: 24px;
    z-index: 10;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }

  .bankrupt-overlay.show {
    display: flex;
  }

  .bankrupt-overlay h2 {
    color: #ff6b6b;
    font-size: 1.2rem;
    letter-spacing: 3px;
  }

  .bankrupt-overlay p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: #888;
    max-width: 280px;
    text-align: center;
    line-height: 1.6;
  }

  .bankrupt-overlay button {
    padding: 12px 28px;
    border: 2px solid #00ffa8;
    border-radius: 10px;
    background: rgba(0,255,168,0.1);
    color: #00ffa8;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 2px;
  }

  .bankrupt-overlay button:hover {
    background: rgba(0,255,168,0.25);
  }

  /* Sound toggle */
  .sound-toggle {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: 1px solid #333;
    border-radius: 8px;
    color: #666;
    font-size: 1.1rem;
    width: 36px;
    height: 36px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sound-toggle:hover { border-color: #666; color: #aaa; }
</style>
</head>
<body>

<div class="machine">
  <button class="sound-toggle" id="soundToggle" title="Toggle sound">🔊</button>
  <div class="machine-title">AI SLOTS</div>
  <div class="machine-subtitle">// where your tokens go to die</div>

  <div class="balance-bar">
    <span class="balance-label">TOKEN BALANCE</span>
    <span class="balance-amount" id="balance">1000</span>
  </div>

  <div class="bet-row">
    <label>BET</label>
    <button class="bet-btn" id="betDown">−</button>
    <span class="bet-display" id="betDisplay">10</span>
    <button class="bet-btn" id="betUp">+</button>
  </div>

  <div class="reel-window">
    <div class="reels" id="reels"></div>
  </div>

  <button class="spin-btn" id="spinBtn">SPIN</button>

  <div class="message" id="message">Spend tokens like a real AI startup.</div>

  <button class="paytable-toggle" id="paytableToggle">[ paytable ]</button>
  <div class="paytable" id="paytable"></div>

  <div class="bankrupt-overlay" id="bankruptOverlay">
    <h2>BANKRUPT</h2>
    <p>Your token budget has been exhausted, just like a real LLM inference run.</p>
    <button id="resetBtn">RETRAIN MODEL (reset)</button>
  </div>
</div>

<script>
  // --- Symbol definitions ---
  const SYMBOLS = [
    { emoji: '🤖', label: 'robot',        id: 'robot'       },
    { emoji: '🧠', label: 'hallucination', id: 'brain'      },
    { emoji: '💩', label: 'bad output',    id: 'poop'        },
    { emoji: '🔥', label: 'GPU fire',     id: 'fire'        },
    { emoji: '💸', label: 'VC money',     id: 'money'       },
    { emoji: '🐛', label: 'bug',          id: 'bug'         },
    { emoji: '☁️', label: 'the cloud',    id: 'cloud'       },
    { emoji: '⚡', label: 'compute',      id: 'lightning'   },
  ];

  // Paytable: 3-of-a-kind multipliers
  const PAYTABLE = {
    robot:     50,   // jackpot
    money:     25,
    lightning: 15,
    brain:     10,
    fire:      8,
    cloud:     5,
    bug:       3,
    poop:      2,
  };

  const TWO_OF_KIND_MULT = 2; // any 2 matching = 2x

  // --- State ---
  let balance = 1000;
  let bet = 10;
  const BET_STEPS = [5, 10, 25, 50, 100];
  let betIndex = 1;
  let spinning = false;
  let soundOn = true;

  // --- DOM refs ---
  const balanceEl = document.getElementById('balance');
  const betDisplayEl = document.getElementById('betDisplay');
  const spinBtn = document.getElementById('spinBtn');
  const messageEl = document.getElementById('message');
  const reelsEl = document.getElementById('reels');
  const paytableEl = document.getElementById('paytable');
  const paytableToggle = document.getElementById('paytableToggle');
  const bankruptOverlay = document.getElementById('bankruptOverlay');
  const resetBtn = document.getElementById('resetBtn');
  const soundToggle = document.getElementById('soundToggle');

  // --- Audio (Web Audio API) ---
  let audioCtx;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playTone(freq, duration, type = 'square', vol = 0.08) {
    if (!soundOn) return;
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = vol;
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  }

  function playSpinTick() { playTone(600 + Math.random() * 300, 0.05, 'square', 0.04); }
  function playStop() { playTone(440, 0.15, 'triangle', 0.1); }
  function playWin() {
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.2, 'sine', 0.1), i * 100));
  }
  function playJackpot() {
    [523, 659, 784, 1047, 1318, 1568].forEach((f, i) => setTimeout(() => playTone(f, 0.3, 'sine', 0.12), i * 120));
  }
  function playLose() { playTone(200, 0.3, 'sawtooth', 0.05); }

  // --- Build paytable display ---
  function buildPaytable() {
    const rows = SYMBOLS.map(s => {
      const mult = PAYTABLE[s.id];
      return `<div class="paytable-row">
        <span>${s.emoji}${s.emoji}${s.emoji} ${s.label}</span>
        <span class="paytable-mult">${mult}x</span>
      </div>`;
    });
    rows.push(`<div class="paytable-row"><span>Any 2 matching</span><span class="paytable-mult">${TWO_OF_KIND_MULT}x</span></div>`);
    paytableEl.innerHTML = rows.join('');
  }

  // --- Build reels ---
  const NUM_REELS = 3;
  const CELLS_VISIBLE = 3; // top, center (win line), bottom
  const STRIP_LENGTH = 30; // symbols in each virtual strip
  const reelStrips = [];
  const reelData = []; // current strip arrays

  function randomSymbol() {
    return SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
  }

  function buildReelStrip() {
    const arr = [];
    for (let i = 0; i < STRIP_LENGTH; i++) arr.push(randomSymbol());
    return arr;
  }

  function renderReels() {
    reelsEl.innerHTML = '';
    for (let r = 0; r < NUM_REELS; r++) {
      const container = document.createElement('div');
      container.className = 'reel-container';
      const strip = document.createElement('div');
      strip.className = 'reel-strip';
      container.appendChild(strip);
      reelsEl.appendChild(container);
      reelStrips.push(strip);

      // initial symbols
      const data = buildReelStrip();
      reelData.push(data);
      renderStrip(r);
      // position to show row 1 at center
      strip.style.transform = `translateY(-80px)`;
    }
  }

  function renderStrip(r) {
    const strip = reelStrips[r];
    strip.innerHTML = '';
    reelData[r].forEach(sym => {
      const cell = document.createElement('div');
      cell.className = 'reel-cell';
      cell.innerHTML = `<div class="symbol-wrap"><span>${sym.emoji}</span><span class="symbol-label">${sym.label}</span></div>`;
      strip.appendChild(cell);
    });
  }

  function setStripPosition(r, index) {
    reelStrips[r].style.transform = `translateY(-${index * 80}px)`;
  }

  // --- Spin logic ---
  async function spin() {
    if (spinning) return;
    if (balance < bet) {
      showBankrupt();
      return;
    }

    spinning = true;
    spinBtn.disabled = true;

    // Deduct bet
    balance -= bet;
    updateBalance();
    messageEl.textContent = 'Processing inference...';
    messageEl.className = 'message';

    // Decide result first
    const results = [randomSymbol(), randomSymbol(), randomSymbol()];

    // Build new strips with results placed at a target index
    const targetIndex = 12; // where the result lands (center of visible area)
    for (let r = 0; r < NUM_REELS; r++) {
      const newData = buildReelStrip();
      newData[targetIndex] = results[r];
      reelData[r] = newData;
      renderStrip(r);
    }

    // Animate: quick scroll then ease to target
    for (let r = 0; r < NUM_REELS; r++) {
      reelStrips[r].classList.add('spinning');
      setStripPosition(r, 0);
    }

    // Force reflow
    void reelStrips[0].offsetHeight;

    // Rapid tick animation
    const tickInterval = setInterval(playSpinTick, 80);

    // Stagger reel stops
    for (let r = 0; r < NUM_REELS; r++) {
      await delay(200 + r * 400);
      reelStrips[r].classList.remove('spinning');
      reelStrips[r].style.transition = `transform ${0.6 + r * 0.1}s cubic-bezier(0.15, 0.8, 0.3, 1.02)`;
      setStripPosition(r, targetIndex - 1); // -1 so center cell is at win line
      await delay(100);
      playStop();
    }

    clearInterval(tickInterval);
    await delay(400);

    // Evaluate
    const r0 = results[0].id, r1 = results[1].id, r2 = results[2].id;
    let winAmount = 0;
    let msg = '';
    let msgClass = 'message';

    if (r0 === r1 && r1 === r2) {
      // Three of a kind
      const mult = PAYTABLE[r0];
      winAmount = bet * mult;
      if (r0 === 'robot') {
        msg = `🤖 JACKPOT! AGI ACHIEVED! +${winAmount} tokens`;
        msgClass = 'message jackpot';
        playJackpot();
        spawnParticles(30);
      } else {
        msg = getWinMessage(results[0], winAmount);
        msgClass = 'message win';
        playWin();
        spawnParticles(12);
      }
    } else if (r0 === r1 || r1 === r2 || r0 === r2) {
      // Two of a kind
      winAmount = bet * TWO_OF_KIND_MULT;
      msg = getSmallWinMessage(winAmount);
      msgClass = 'message win';
      playWin();
    } else {
      msg = getLoseMessage();
      msgClass = 'message lose';
      playLose();
    }

    if (winAmount > 0) {
      balance += winAmount;
      updateBalance(true);
    }

    messageEl.textContent = msg;
    messageEl.className = msgClass;

    spinning = false;
    spinBtn.disabled = false;

    if (balance < BET_STEPS[0]) {
      await delay(1200);
      showBankrupt();
    }
  }

  // --- Messages ---
  const WIN_MESSAGES = {
    robot:     (amt) => `🤖 Three robots! Skynet approves. +${amt}`,
    brain:     (amt) => `🧠 Triple hallucination! Somehow correct. +${amt}`,
    poop:     (amt) => `💩 Three bad outputs... but it's "creative". +${amt}`,
    fire:      (amt) => `🔥 GPU fire x3! Warranty voided, tokens gained. +${amt}`,
    money:     (amt) => `💸 VC money x3! Series Z funding secured. +${amt}`,
    bug:       (amt) => `🐛 Three bugs! Ship it, call it a feature. +${amt}`,
    cloud:     (amt) => `☁️ The cloud x3! Your data is everywhere now. +${amt}`,
    lightning: (amt) => `⚡ Compute x3! NVIDIA stock just went up. +${amt}`,
  };

  function getWinMessage(sym, amt) {
    return WIN_MESSAGES[sym.id](amt);
  }

  const SMALL_WIN_MSGS = [
    (a) => `Two matching! The model got partially right. +${a}`,
    (a) => `Partial match — like AI accuracy stats. +${a}`,
    (a) => `Two of a kind. Close enough for government AI. +${a}`,
    (a) => `A pair! Better than most chatbot answers. +${a}`,
  ];

  function getSmallWinMessage(amt) {
    return SMALL_WIN_MSGS[Math.floor(Math.random() * SMALL_WIN_MSGS.length)](amt);
  }

  const LOSE_MSGS = [
    'No match. Model hallucinated the wrong output.',
    'Nothing. Your tokens vanished into the cloud.',
    'Loss. Just like real AI — expensive and wrong.',
    'Nope. At least it was fast (and wrong).',
    'Nothing. The AI confidently produced garbage.',
    'Token burn complete. Shareholders pleased.',
    'Loss. "We\'ll fix it in the next epoch."',
    'Miss. That\'s what you get for prompt engineering.',
    'Zero. The model needs more training data (money).',
  ];

  function getLoseMessage() {
    return LOSE_MSGS[Math.floor(Math.random() * LOSE_MSGS.length)];
  }

  // --- Particles ---
  function spawnParticles(count) {
    const emojis = ['💰', '⚡', '🪙', '✨', '🤖', '🎰'];
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        p.style.left = Math.random() * window.innerWidth + 'px';
        p.style.top = (Math.random() * 0.5 + 0.3) * window.innerHeight + 'px';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1500);
      }, i * 60);
    }
  }

  // --- Balance ---
  function updateBalance(animate = false) {
    balanceEl.textContent = balance.toLocaleString();
    if (animate) {
      balanceEl.classList.remove('bump');
      void balanceEl.offsetHeight;
      balanceEl.classList.add('bump');
    }
  }

  // --- Bet ---
  function changeBet(dir) {
    betIndex = Math.max(0, Math.min(BET_STEPS.length - 1, betIndex + dir));
    bet = BET_STEPS[betIndex];
    betDisplayEl.textContent = bet;
  }

  // --- Bankrupt ---
  function showBankrupt() {
    bankruptOverlay.classList.add('show');
  }

  function resetGame() {
    balance = 1000;
    betIndex = 1;
    bet = BET_STEPS[betIndex];
    updateBalance();
    betDisplayEl.textContent = bet;
    bankruptOverlay.classList.remove('show');
    messageEl.textContent = 'Model retrained. Tokens restored. Try again.';
    messageEl.className = 'message';
  }

  // --- Helpers ---
  function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  // --- Events ---
  spinBtn.addEventListener('click', spin);
  document.getElementById('betDown').addEventListener('click', () => { if (!spinning) changeBet(-1); });
  document.getElementById('betUp').addEventListener('click', () => { if (!spinning) changeBet(1); });
  paytableToggle.addEventListener('click', () => paytableEl.classList.toggle('open'));
  resetBtn.addEventListener('click', resetGame);
  soundToggle.addEventListener('click', () => {
    soundOn = !soundOn;
    soundToggle.textContent = soundOn ? '🔊' : '🔇';
  });

  // Keyboard: space to spin
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !spinning) {
      e.preventDefault();
      spin();
    }
  });

  // --- Init ---
  buildPaytable();
  renderReels();
</script>
</body>
</html>
